<div class="patient-list-container">
      <div class="header">
        <h2 class="title">Patients</h2>
        <button class="search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13 13L16.5 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="patient-list">
        @for (patient of patients(); track patient.name) {
          <div
            class="patient-item"
            [class.active]="selectedPatient()?.name === patient.name"
            (click)="onSelect(patient)">
            <img [src]="patient.profile_picture" [alt]="patient.name" class="patient-avatar">
            <div class="patient-info">
              <div class="patient-name">{{ patient.name }}</div>
              <div class="patient-meta">{{ patient.gender }}, {{ patient.age }}</div>
            </div>
            <button class="more-btn" aria-label="More options">
              <svg width="18" height="4" viewBox="0 0 18 4" fill="none">
                <circle cx="2" cy="2" r="2" fill="currentColor"/>
                <circle cx="9" cy="2" r="2" fill="currentColor"/>
                <circle cx="16" cy="2" r="2" fill="currentColor"/>
              </svg>
            </button>
          </div>
        }
      </div>
    </div>
